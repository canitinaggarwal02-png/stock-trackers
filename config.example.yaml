# Alert rules for your positions and watchlist
alerts:
  stop_loss_pct: 8          # alert if a holding falls this much below your buy price (when you set no stop loss)
  target_pct: 20            # alert if a holding rises this much above your buy price (when you set no target)
  volume_spike_ratio: 2.5   # today's volume vs 20-day average
  delivery_spike_ratio: 1.8 # today's delivery qty vs 20-day average
  big_move_pct: 4           # single-day price move
  min_hours_between_same_alert: 20

# Dashboard password. Required before opening the dashboard to your phone
# (python run.py dashboard --phone). Leave empty to use it only on this computer.
dashboard:
  password: ""

notifications:
  desktop: true
  # Telegram = use the tracker from your phone anywhere (reminders + commands like /picks, /bought).
  telegram:
    enabled: false
    bot_token: ""     # create a bot with @BotFather
    chat_id: ""       # run `python run.py bot`, send /start to your bot, it replies with this number
  email:
    enabled: false
    smtp_host: smtp.gmail.com
    smtp_port: 587
    username: ""
    password: ""      # for Gmail use an App Password, not your normal password
    to: ""
